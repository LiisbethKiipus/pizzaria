name: Laravel Deployment

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        services:
            mariadb:
                image: mariadb:10.11
                env:
                    MYSQL_ROOT_PASSWORD: root
                    MYSQL_DATABASE: laravel_test
                    MYSQL_USER: laravel
                    MYSQL_PASSWORD: laravel
                ports:
                    - 3306:3306
                options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=5s --health-retries=10

        env:
            DB_CONNECTION: mysql
            DB_HOST: 127.0.0.1
            DB_PORT: 3306
            DB_DATABASE: laravel_test
            DB_USERNAME: laravel
            DB_PASSWORD: laravel

        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  extensions: mbstring, bcmath, pdo_mysql, mysqli, tokenizer
                  coverage: none

            - name: Install Composer dependencies
              run: composer install --no-progress --no-suggest --prefer-dist

            - name: Set up Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: '24'

            - name: Install NPM dependencies
              run: npm install

            - name: Generate application key
              run: php artisan key:generate

            # --- Linting ---
            - name: Run JS/React Linter
              run: npm run lint

            - name: Run PHPStan
              run: php vendor/bin/phpstan analyse --memory-limit=512M

            - name: Run PHPCS
              run: php vendor/bin/phpcs

            # --- Tests ---
            - name: Clear config cache
              run: php artisan config:clear --ansi

            - name: Run PHP tests
              run: php artisan test

            - name: Run TS/JS type checks
              run: npm run types

            # --- Migration check ---
            - name: Test database migration
              run: php artisan migrate --force

            # --- Frontend build ---
            - name: Build frontend
              run: npm run dev

            # --- Serve backend ---
            - name: Start Laravel server
              run: php artisan serve --host=0.0.0.0 --port=8000 &

            - name: Wait for server to be ready
              run: |
                  for i in {1..20}; do
                      if curl -s http://127.0.0.1:8000 >/dev/null; then
                          echo "Server is up!"
                          exit 0
                      fi
                      echo "Waiting for server..."
                      sleep 3
                  done
                  echo "Server did not start in time"
                  exit 1
